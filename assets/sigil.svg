    <circle cx="100" cy="100" r="90" fill="none" stroke="#8c2f24" stroke-width="3.2"/>

    <!-- SWORD (rotated +45): blade, crossguard, grip, pommel -->
    <g transform="rotate(45 100 100)">
      <path d="M100,26 L106,50 L106,120 L94,120 L94,50 Z"/>
      <path d="M68,122 L75,116 L125,116 L132,122 L125,128 L75,128 Z"/>
      <path d="M95,128 L105,128 L105,158 L95,158 Z"/>
      <circle cx="100" cy="164" r="8"/>
