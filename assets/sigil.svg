      <path d="M95,40 L105,40 L105,170 L95,170 Z"/>
      <path d="M100,26 L105,40 L95,40 Z"/>
      <path d="M105,82 L126,84 L126,96 L105,98 Z"/>
      <path d="M124,50 Q156,54 168,90 Q156,126 124,130 Q134,106 132,88 Q134,70 124,50 Z"/>
